# Lumi place-policy v3 task config (ConversionVersion v6, ANCHORED actions).
# COPY'd into the ManiFlow clone as maniflow/config/robotwin_task/lumi_place_v3.yaml
# Selected at launch via: robotwin_task=lumi_place_v3
#
# v3 vs v1/v2:
#   - obs = head_cam + depth_cam + prev_action(6) + task(1); joints/imu/suction/module_width dropped.
#   - action = ANCHORED-to-chunk-start camera-frame deltas (dataset builds them per sample
#     from stored absolute poses; last row = chunk endpoint = the goal for a full descent).
#   - goal_cam (6) rides ALONGSIDE action for the aux goal head (never an obs / ONNX input).
#   - depth stored uint16 mm; this config uses `bands` = 10 near-focused H3DP channels
#     (docs/v3_depth_design.md). The 3-channel pooled control (B0) uses lumi_place_v3_tiled.

name: lumi_place_v3

# depth_cam channel count MUST equal the dataset's emitted channels: bands (len(edges)-1=10)
# for this config. The pooled/tiled control arm (B0) selects the sibling config
# `lumi_place_v3_tiled` (3-channel), rather than trying to reshape this one — keeps
# shape_meta a plain int literal (no fragile in-list interpolation) and the dataset asserts
# its emitted channels match.

shape_meta:
  obs:
    head_cam:
      shape: [3, 224, 224]
      type: rgb
      horizon: ${n_obs_steps}
    depth_cam:
      shape: [10, 224, 224]    # 10 near-focused H3DP band channels (docs/v3_depth_design.md)
      type: rgb                # encoder builds a matching 10-ch depth trunk
      horizon: ${n_obs_steps}
    prev_action:
      shape: [6]               # previous-step executed camera-frame delta (row0 = zeros)
      type: low_dim
      horizon: ${n_obs_steps}
    task:
      shape: [1]               # [neighbor_present]
      type: low_dim
      horizon: ${n_obs_steps}
  action:
    shape: [6]                 # anchored-to-chunk-start camera-frame deltas [dx,dy,dz,rotvec(3)]
    horizon: ${horizon}

dataset:
  _target_: maniflow.dataset.lumi_place_image_dataset.LumiPlaceImageDataset
  zarr_path: ???               # override at launch: robotwin_task.dataset.zarr_path=...
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  # depth encoding — MUST agree with shape_meta.obs.depth_cam channel count:
  #   bands = 10 near-focused H3DP channels (matches [10,224,224]); the v3 default.
  # (a 3-channel "tiled" run needs shape_meta depth_cam back to [3,224,224].)
  depth_input: bands
  depth_band_edges: [0.30, 0.45, 0.60, 0.75, 0.90, 1.05, 1.20, 1.35, 1.50, 3.00, 6.00]  # 11 edges -> 10 bins
  depth_band_soft: 0.05        # meters of soft falloff at each band edge
  # spec 4.4 dataloader-side augmentation — zarr stays clean; overridable from
  # training_config via robotwin_task.dataset.augmentation.*
  augmentation:
    enable: true
    depth_noise_sigma0: 0.005
    depth_px_dropout: 0.02
    depth_flying_px: 0.005
    depth_episode_dropout: 0.4
    prev_action_noise_mm: 0.5
    prev_action_noise_deg: 0.05
    latency_shift_prob: 0.5
