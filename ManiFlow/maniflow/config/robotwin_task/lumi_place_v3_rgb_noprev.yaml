# Lumi place-policy E1 arm — RGB-ONLY, prev_action REMOVED from obs (copycat channel killed).
# Selected at launch via: robotwin_task=lumi_place_v3_rgb_noprev
#
# Identical to lumi_place_v3_rgb EXCEPT prev_action is dropped from shape_meta.obs, so the
# encoder never sees it and phase/motion must be read from the 2 RGB frames. The dataset still
# emits prev_action (harmless): it is used only to fit the normalizer and (if idm_loss_weight>0)
# as the vision-only inverse-dynamics TARGET — never as a model input. Rationale (docs/
# rgb_attention_redesign.md, Stage B / arm E1): PAR≈0 at proprio_mask_p=0.5 says the network
# barely uses prev_action; anchored chunks can execute the short J6 blind tail open-loop. The
# E0(keep)↔E1(drop) free-running delta is the definitive test of whether killing the copycat
# channel makes RGB load-bearing on this fixed dataset.

name: lumi_place_v3_rgb_noprev

shape_meta:
  obs:
    head_cam:
      shape: [3, 224, 224]
      type: rgb
      horizon: ${n_obs_steps}
    task:
      shape: [1]               # [neighbor_present]
      type: low_dim
      horizon: ${n_obs_steps}
  action:
    shape: [6]                 # anchored-to-chunk-start camera-frame deltas [dx,dy,dz,rotvec(3)]
    horizon: ${horizon}

dataset:
  _target_: maniflow.dataset.lumi_place_image_dataset.LumiPlaceImageDataset
  zarr_path: ???               # override at launch: robotwin_task.dataset.zarr_path=...
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  use_depth: false             # no depth stream: no zarr depth read, no depth_cam in obs
  augmentation:
    enable: true
    prev_action_noise_mm: 0.5
    prev_action_noise_deg: 0.05
    latency_shift_prob: 0.5
    # v7 Rewire schema (default OFF; set per-run via training_config -> AUG_KEYS overrides)
    gpu_offload: false           # skip CPU SO(2)+photometric; workspace does it on the CUDA batch
    rot_aug_deg: 0.0
    photo_brightness: 0.0
    photo_contrast: 0.0
    photo_saturation: 0.0
    photo_hue: 0.0
    photo_blur_p: 0.0
    photo_noise: 0.0
    photo_erase_p: 0.0
