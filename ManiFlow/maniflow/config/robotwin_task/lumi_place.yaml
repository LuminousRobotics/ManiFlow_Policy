# Lumi place-policy task config for ManiFlow.
# COPY'd into the ManiFlow clone as ManiFlow/maniflow/config/robotwin_task/lumi_place.yaml
# Selected at launch via: robotwin_task=lumi_place
#
# NOTE: no env_runner block and no robotwin_env default on purpose — training never reads
# them, and a dangling ${robotwin_task.robotwin_env} interpolation crashes wandb's
# OmegaConf resolve. Sim eval (Isaac env) is a separate future workspace.

name: lumi_place

shape_meta:
  obs:
    head_cam:
      shape: [3, 224, 224]
      type: rgb
      horizon: ${n_obs_steps}
    depth_cam:
      shape: [3, 224, 224]
      type: rgb
      horizon: ${n_obs_steps}
    agent_pos:
      shape: [8]              # joint pos (7) + suction_on (1)
      type: low_dim
      horizon: ${n_obs_steps}
    imu:
      shape: [10]             # quat wxyz (4) + ang_vel (3) + lin_acc (3)
      type: low_dim
      horizon: ${n_obs_steps}
    task:
      shape: [2]              # [neighbor_present, module_width_m]
      type: low_dim
      horizon: ${n_obs_steps}
  action:
    shape: [6]                # camera-frame anchored deltas [dx,dy,dz,rotvec(3)]
    horizon: ${horizon}

dataset:
  _target_: maniflow.dataset.lumi_place_image_dataset.LumiPlaceImageDataset
  zarr_path: ???              # override at launch: robotwin_task.dataset.zarr_path=...
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  # spec 4.4 dataloader-side augmentation — zarr stays clean; every knob is
  # overridable from training_config.yaml via robotwin_task.dataset.augmentation.*
  augmentation:
    enable: true
    depth_noise_sigma0: 0.005
    depth_px_dropout: 0.02
    depth_flying_px: 0.005
    depth_episode_dropout: 0.4
    imu_grav_noise_deg: [0.5, 2.0]
    imu_mount_offset_deg: 0.5
    imu_bias_angvel: 0.02
    imu_bias_linacc: 0.1
    imu_walk_scale: 0.1
    imu_episode_dropout: 0.15
    latency_shift_prob: 0.5
