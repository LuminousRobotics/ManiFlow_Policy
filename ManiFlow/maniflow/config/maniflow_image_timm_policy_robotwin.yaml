defaults:
  - robotwin_task: diverse_bottles_pick_image

name: train_maniflow_image_timm_policy

task_name: ${robotwin_task.name}
shape_meta: ${robotwin_task.shape_meta}
exp_name: "debug"

horizon: 16
n_obs_steps: 2
# H-series: this scalar cannot describe all four arms (rows are 15/15/15/16, contract §3 FINAL),
# so in H mode the policy OVERRIDES it with its own `action_rows` and says so in the log. It still
# feeds `robotwin_task.dataset.pad_after`, which the dataset raises to H-1 regardless. Outside H
# it keeps its stock meaning (how many rows of the chunk to execute per inference).
n_action_steps: 16
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: true

# Lumi v7: run SO(2)+photometric augmentation on the CUDA batch in the train loop instead of
# per-sample on the CPU DataLoader workers (frees the L40S). Pair with
# robotwin_task.dataset.augmentation.gpu_offload=true so the dataset skips its own SO(2)/photometric.
gpu_augment: false

policy:
  _target_: maniflow.policy.maniflow_image_policy.ManiFlowTransformerImagePolicy
  block_type: "DiTX"
  n_layer: 12  # max 28
  n_head: 8  # max 16
  n_emb: 768 # max 1152
  visual_cond_len: 1024 # max 1024
  max_lang_cond_len: 1024 # maximum length of language tokens
  qkv_bias: true
  qk_norm: true

  language_conditioned: false
  pre_norm_modality: false

  flow_batch_ratio: 0.75 
  consistency_batch_ratio: 0.25

  sample_t_mode_flow: "beta" # choose between beta or lognorm, both are performing well
  sample_t_mode_consistency: "discrete"
  sample_dt_mode_consistency: "uniform"
  sample_target_t_mode: "relative" # "absolute", "relative"
  denoise_timesteps: 10

  # --- Lumi v2 precision losses (defaults OFF => stock ManiFlow). Set via training_config.yaml. ---
  endpoint_loss_weight: 0.0        # lambda for x1-reconstruction aux loss (flow branch only)
  endpoint_loss_type: "mse"        # "mse" | "l1"
  endpoint_t_clip: 0.98            # clip t before 1/(1-t) in x1_hat reconstruction
  action_step_weights: null        # optional per-chunk-step weights (len==horizon), up-weight contact steps
  action_dim_weights: null         # optional per-action-dim weights (len==action_dim), up-weight rotvec/yaw
  # --- Lumi v3 auxiliary goal head (default OFF => no head built). ---
  goal_loss_weight: 0.0            # lambda for goal-in-camera-frame aux head (Huber); 0 => off
  goal_loss_type: "huber"          # "huber" | "mse"
  # --- Lumi C2: low-dim -> AdaLN-Zero routing (default OFF => stock v3 cross-attn tokens) ---
  lowdim_to_adaln: false           # prev_action/task drive AdaLN (pair with obs_encoder.lowdim_as_tokens=false)
  proprio_mask_p: 0.0              # per-sample training prob of masking prev_action (keeps vision load-bearing)
  idm_loss_weight: 0.0             # v7 Rewire: lambda for the vision-only inverse-dynamics aux head; 0 => off
  # --- F-series: soft-argmax keypoint head + self-predicted goal token (ON the actor path) ---
  kpt_loss_weight: 0.0             # rail/tube keypoint soft-argmax head; 0 => no F heads built
  place_loss_weight: 0.0           # keypoint -> place-pose regression (vs goal_cam)
  n_keypoints: 7                   # converter N_KEYPOINTS (rail samples + tube)
  kpt_head_hires: false            # G1: 56x56 deconv heatmap head + log-z -> N 3-D point tokens
  pointnet_dim: 0                  # F1-depth: PointNet on the xyz point-map -> 3D token; 0 => off
  # --- H-series (v10): ee_link action space + goal-frame anchoring (contract §3/§4/§7).
  # action_param: null keeps EVERY prior arm bit-identical (the whole H chassis stays off).
  # The four arms: H0 twist/cam0 . H1 twist/goal . H-delta delta/cam0 . H1-delta delta/goal.
  # robotwin_task.dataset.action_param / .action_frame MUST match — the policy asserts that the
  # row count it predicts equals the row count the dataset emits.
  action_param: null               # null | "twist" | "delta"
  action_frame: "cam0"             # "cam0" | "goal"
  control_hz: 10.0                 # Delta t = 1/control_hz for the twist rows + integral
  rot_integral_approx: false       # ablation: small-angle SUM instead of SO(3) composition
  goal_integral_weight: 0.0        # goal-coincidence integral constraint (goal frames only)
  terminal_zero_weight: 0.0        # terminal settle ||row_last||         (goal frames only)
  goal_consistency_weight: 0.0     # ||u_0 - ad(P_0, G_hat, R_g)||        (delta+goal only)
  action_rate_weight: 0.05         # sum_k ||row_k - row_{k-1}||^2 (executability; H only)
  goal_frame_self_p_max: 0.0       # scheduled sampling on the OUTPUT frame: max self-prob
  goal_frame_anneal_epochs: 40     # ... ramped 0 -> max over this many epochs
  phase_loss_weight: 0.0           # phase head CE vs phase_id (0=place_xy, 1=place_z)
  done_loss_weight: 0.0            # done head BCE vs done
  rgb3d_pos_enc: false             # 3D-aware RGB tokens (zero-init xyz patch-pool ADD)
  pointnet_tokens: 16              # K PointNet tokens (4x4 masked-max-pool grid); 1 => legacy
  # The place head's PRIMARY target is panel_goal_cam (contract §1.2b: rail_a + grasp_offset
  # leaves the along-rail DoF free by 0.19 m, so rail_a cannot BE the goal). rail_a_cam stays as
  # an AUX landmark-grounding head weighted at this fraction of place_loss_weight; 0 disables it.
  rail_aux_weight: 0.25

  diffusion_timestep_embed_dim: 128
  diffusion_target_t_embed_dim: 128


  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  num_inference_steps: 10
  obs_as_global_cond: true
  shape_meta: ${shape_meta}

  obs_encoder:
    _target_: maniflow.model.vision_2d.timm_obs_encoder.TimmObsEncoder
    shape_meta: ${shape_meta}

    ##### from scratch #####
    # model_name: 'vit_base_patch16_224'
    # model_name: 'resnet34'
    # model_name: 'vit_tiny_patch16_224'
    # model_name: 'efficientnet_b0'
    # model_name: 'efficientnet_b3'
    # pretrained: False
    # frozen: False

    ##### from scratch #####
    # model_name: 'resnet34.a1_in1k'
    # model_name: 'vit_base_patch16_clip_224.openai'
    # model_name: 'convnext_base.clip_laion2b_augreg_ft_in12k'
    # pretrained: True
    # frozen: False
    
    model_name: 'r3m'
    pretrained: False
    frozen: False

    global_pool: ''

    feature_aggregation: null
    position_encording: 'sinusoidal' # 'learnable' or 'sinusoidal'. it only works for transformer

    downsample_ratio: 32

    # v3 dense-token conditioning (default OFF => v1/v2 single-token behaviour). B1 sets
    # token_output=True + model_name='resnet18.a1_in1k' + pretrained=True via training_config.
    token_output: False
    # C2: when False (with token_output), prev_action/task are NOT cross-attn tokens —
    # the policy routes them into DiTX AdaLN-Zero (pair with policy.lowdim_to_adaln=true).
    lowdim_as_tokens: True

    # G1: encoder-side transforms REMOVED. The paired RandomCrop shifted pixels while the
    # arm_kpts_uv keypoint labels stayed in full-frame coordinates -> systematic label noise
    # up to ~5% of frame on the F-series keypoint supervision (found 2026-07-26). Photometric
    # aug lives in the GPU-aug (label-free); a label-co-transformed shift-jitter is the
    # next-run replacement for the crop.
    transforms: null
     
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True


ema:
  _target_: maniflow.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True
  drop_last: True   # consistency loss (v_ct = (pred-x)/(1-t), 75/25 flow/consistency
                    # split) is ill-defined on an undersized remainder batch -> NaN.
                    # Full batches only. (upstream shipped this commented-out.)

val_dataloader:
  batch_size: 128 # 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False
  drop_last: True   # same reason: a small trailing val batch -> NaN val_loss that
                    # torch.mean propagates to the whole epoch. Drop it.

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-3

training:
  device: "cuda:0"
  env_device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 501
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 100
  checkpoint_every: 100
  val_every: 50
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${training.seed}
  project: ManiFlow_2d
  resume: true
  tags:
  - ${logging.project}

checkpoint:
  save_ckpt: True # if True, save checkpoint every checkpoint_every
  topk:
    # Lumi v3: select on VAL-SPLIT GOAL POSITION ERROR (mm, full val set) — the
    # deployment-meaningful landing metric. v2 used val_action_mse_error (one batch);
    # val velocity-loss is ~uncorrelated with success (docs/v2_plan.md OQ2).
    # format_str='auto' derives the filename from monitor_key (avoids hydra brace-quoting).
    monitor_key: val_goal_pos_mm # val_goal_pos_mm, val_action_mse_error, val_loss
    mode: min
    k: 1
    format_str: auto
  save_last_ckpt: True # this only saves when save_ckpt is True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
